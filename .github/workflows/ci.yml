name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      # Runs gofmt, go vet and the linters listed in backend/.golangci.yml.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend

      - name: Unit testing of modules
        run: go test ./... -race -coverprofile=coverage.out

      - name: Coverage report
        run: |
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          path: backend/coverage.out
          name: backend-coverage
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node and cache dependencies
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install lockfile dependencies
        run: npm ci

      - name: Lint files
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Build app
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          path: frontend/coverage
          name: frontend-coverage
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start docker
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Connection verification
        run: |
          # The page is served
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/

          # The API is alive
          curl --fail --silent --show-error http://localhost:8080/health

          # A real calculation, sent the way the browser sends it
          curl --fail --silent --show-error -X POST http://localhost:8080/add \
            -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/json' \
            -d '{"a":6,"b":3}' | grep -q '"result":10'

          # The CORS preflight allows the frontend's origin
          curl --fail --silent --show-error --include -X OPTIONS http://localhost:8080/add \
            -H 'Origin: http://localhost:3000' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: Content-Type' \
            | grep -qi '^access-control-allow-origin: http://localhost:3000'

      - name: Show container logs
        if: failure()
        run: docker compose logs
