version: "2"

linters:
  # On top of the defaults:
  enable:
    - revive # doc comments, early returns, naming
    - errorlint # errors.Is / errors.As instead of == and type assertions
    - gosec # common security mistakes
    - misspell
  exclusions:
    presets:
      - std-error-handling # unchecked errors from calls like Close()

formatters:
  enable:
    - gofmt
